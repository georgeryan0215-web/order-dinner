<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>點餐</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#222;--mu:#777;--ac:#d9480f;--bd:#e6e1d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a18;--card:#262421;--tx:#f1ede6;--mu:#a49d92;--ac:#ff8a4c;--bd:#3a3731;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1a18;--card:#262421;--tx:#f1ede6;--mu:#a49d92;--ac:#ff8a4c;--bd:#3a3731;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 20px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:14px 0 6px}
.routes{display:grid;gap:10px}
button{font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 14px;cursor:pointer;text-align:left}
.routes button:hover{border-color:var(--ac)}.routes small{display:block;color:var(--mu);font-size:13px}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac);text-align:center;width:100%;margin-top:6px}
input,textarea{font:inherit;width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin-bottom:10px}
textarea{min-height:84px;resize:vertical}
.st{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.lock{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.badge{background:var(--ac);color:#fff;border-radius:8px;padding:2px 10px;font-size:13px}
.big{font-size:20px;font-weight:700}
ul{list-style:none;margin:0;padding:0}li{padding:10px 0;border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:10px}
li:first-child{border-top:0}.mu{color:var(--mu);font-size:14px}
.link{background:none;border:0;color:var(--mu);padding:0;text-decoration:underline;font-size:13px;width:auto}
.step{display:flex;align-items:center;gap:8px;flex:none}.step button{padding:4px 12px;font-size:18px;text-align:center}.step b{min-width:20px;text-align:center}
.tot{font-weight:700;text-align:right;margin:4px 0 8px}
.mimg{max-width:100%;border-radius:10px;border:1px solid var(--bd);display:block;margin:6px 0}
#msg{color:var(--ac);min-height:20px;font-size:14px;margin:6px 0 0}
</style>
</head>
<body>
<main>
<h1>點餐</h1>
<p class="sub" id="sub"></p>
<div id="adminCard" class="card" hidden></div>
<div id="app" class="card">載入中…</div>
<div id="orderCard" class="card" hidden></div>
<div id="listCard" class="card" hidden>
<h2>彙整（<span id="cnt">0</span> 人）</h2>
<div id="sumStores"></div>
<button class="pri" id="copy">複製彙整文字</button><textarea id="copyBox" hidden readonly></textarea>
</div>
<p style="text-align:center"><button class="link" id="reset" hidden>管理者：重設這場的路線</button></p>
</main>
<script>
// 固定路線；店家與菜單由管理者在頁面上新增
const ROUTES = ["廟街", "建中街", "中華路"];
const MAX = [11, 11, 4]; // 各路線可新增的店家數量上限
const $ = id => document.getElementById(id);
let db, uid, isOwner = false, cfg = {}, sess = null, myOrder = null, unOrders = null, orderCache = [];
let pickedStore = null, builtKey = null, qtyKey = null, touched = false, qty = {}, draft = null, dirty = false;
const num = n => Number(n) || 0;
const storesOf = i => { const a = cfg["s" + i]; return Array.isArray(a) ? a.map(s => typeof s === "string" ? { name: s, items: [] } : { name: s.name || "", items: Array.isArray(s.items) ? s.items : [], img: s.img || "" }) : []; };
const routeIdx = r => ROUTES.indexOf(r);
const pad = n => String(n).padStart(2, "0");
const fmt = t => { const d = new Date(t); return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
function msg(t){ const m = $("msg"); if (m) m.textContent = t || ""; }
function mk(tag, text, cls){ const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }

/* ---------- 管理者 ---------- */
function parseMenu(t){ return t.split("\n").map(l => l.trim()).filter(Boolean).map(l => { const m = l.match(/^(.+?)[\s,，:：$＄]+(\d+(?:\.\d+)?)\s*元?$/); return m ? { n: m[1].trim(), p: Number(m[2]) } : { n: l, p: 0 }; }); }
const menuText = items => items.map(i => i.n + " " + i.p).join("\n");
async function shrink(file){
  try { const bmp = await createImageBitmap(file), sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc); c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.85)); } catch(e) { return file; }
}
function buildEditor(){
  const box = $("storeEdit"); box.textContent = "";
  ROUTES.forEach((r, i) => {
    box.appendChild(mk("h3", r + "（" + draft[i].length + " / " + MAX[i] + " 家）"));
    draft[i].forEach((s, j) => {
      const w = mk("div", null, "st"), n = document.createElement("input"), t = document.createElement("textarea"), d = mk("button", "刪除這家店", "link");
      n.placeholder = "店家名稱"; n.value = s.name; n.oninput = () => { s.name = n.value; dirty = true; };
      t.placeholder = "菜單，一行一道：\n雞腿飯 90\n排骨飯 85"; t.value = s.menu; t.oninput = () => { s.menu = t.value; dirty = true; };
      d.onclick = () => { if (confirm("刪除「" + (s.name || "未命名") + "」？")) { draft[i].splice(j, 1); dirty = true; buildEditor(); } };
      const im = mk("div", null, "mu"), f = document.createElement("input");
      const drawImg = () => { im.textContent = ""; if (s.img) { const g = document.createElement("img"); g.src = "/_blob/" + s.img; g.className = "mimg"; const x = mk("button", "移除圖片", "link"); x.onclick = () => { s.img = ""; dirty = true; drawImg(); }; im.append(g, x); } };
      drawImg(); f.type = "file"; f.accept = "image/*"; f.style.marginBottom = "6px";
      f.onchange = async () => { const file = f.files[0]; if (!file) return; im.textContent = "上傳中…"; try { const assets = await claude.use("assets"); if (!assets) throw new Error("no assets"); const r = await assets.upload(await shrink(file)); s.img = r.id; dirty = true; } catch(e) { im.textContent = "圖片上傳失敗，請重試"; return; } drawImg(); };
      w.append(n, t, mk("div", "菜單圖片（選填，記得按「儲存」）", "mu"), f, im, d); box.appendChild(w);
    });
    const full = draft[i].length >= MAX[i], a = mk("button", full ? "已達 " + MAX[i] + " 家上限" : "＋ 新增店家"); a.disabled = full; a.onclick = () => { if (draft[i].length >= MAX[i]) return; draft[i].push({ name: "", menu: "" }); dirty = true; buildEditor(); }; box.appendChild(a);
  });
}
function renderAdmin(){
  const c = $("adminCard");
  if (!isOwner) { c.hidden = true; return; }
  c.hidden = false;
  if (!c.dataset.built) {
    c.dataset.built = "1";
    c.innerHTML = '<h2>管理者</h2><button class="pri" id="newSess">新增一場點餐</button><h3>各路線的店家與菜單</h3><p class="mu">菜單會顯示給同事參考，一行一道，例如「雞腿飯 90」。同事點餐時自行輸入想吃什麼。</p><div id="storeEdit"></div><button class="pri" id="saveStores">儲存店家與菜單</button><div id="amsg" class="mu"></div>';
    $("newSess").onclick = async () => {
      if (sess && sess.route == null && !confirm("目前這場還沒有人選路線，確定要另開新的一場嗎？")) return;
      try { await db.doc("sessions/s" + Date.now()).set({ createdAt: Date.now(), route: null, byName: "", at: 0 }); } catch(e) { $("amsg").textContent = "新增失敗，請重試"; }
    };
    $("saveStores").onclick = async () => {
      const o = {}; ROUTES.forEach((r, i) => { o["s" + i] = draft[i].filter(s => s.name.trim()).map(s => ({ name: s.name.trim(), items: parseMenu(s.menu), img: s.img || "" })).slice(0, MAX[i]); });
      try { await db.doc("config/routes").set(o); dirty = false; $("amsg").textContent = "已儲存"; } catch(e) { $("amsg").textContent = "儲存失敗，請重試"; }
    };
  }
  if (!dirty) { draft = ROUTES.map((r, i) => storesOf(i).map(s => ({ name: s.name, menu: menuText(s.items), img: s.img || "" }))); buildEditor(); }
}

/* ---------- 路線與店家 ---------- */
function renderRoute(){
  const app = $("app"); app.textContent = "";
  if (!sess) {
    app.textContent = isOwner ? "目前沒有點餐，請按上方「新增一場點餐」。" : "目前沒有開放的點餐，請等管理者新增。";
    $("orderCard").hidden = true; $("reset").hidden = true; $("sub").textContent = ""; renderList(); return;
  }
  $("sub").textContent = "本場開單時間：" + fmt(sess.createdAt) + "　第一位選擇路線的人決定路線，其他人會自動跟隨。";
  if (sess.route) {
    const st = storesOf(routeIdx(sess.route));
    app.innerHTML = '<h2>本場路線</h2><div class="lock"><span class="badge">已鎖定</span><span class="big"></span></div><p class="mu" id="by"></p><h3 id="sth"></h3><div class="routes" id="stbtns"></div>';
    app.querySelector(".big").textContent = sess.route;
    $("by").textContent = sess.byName ? sess.byName + " 選擇了這條路線" : "";
    $("sth").textContent = st.length ? "請選擇店家" : "";
    if (myOrder && myOrder.store && !pickedStore) pickedStore = myOrder.store;
    st.forEach(s => {
      const b = mk("button", (pickedStore === s.name ? "✓ " : "") + s.name);
      if (pickedStore === s.name) b.style.borderColor = "var(--ac)";
      b.onclick = () => { pickedStore = s.name; renderRoute(); };
      $("stbtns").appendChild(b);
    });
    renderOrder();
  } else {
    app.innerHTML = '<h2>還沒有人選路線，請你先選</h2><input id="who" placeholder="你的名字" maxlength="20"><div class="routes" id="rts"></div><div id="msg"></div>';
    try { $("who").value = localStorage.getItem("lunchName") || ""; } catch(e) {}
    ROUTES.forEach((r, i) => { const b = mk("button", r); b.appendChild(mk("small", storesOf(i).map(s => s.name).join("、") || "（尚未設定店家）")); b.onclick = () => claim(r); $("rts").appendChild(b); });
    $("orderCard").hidden = true;
  }
  $("reset").hidden = !(isOwner && sess.route);
  renderList();
}
async function claim(r){
  const name = $("who").value.trim();
  if (!name) { msg("請先輸入名字"); return; }
  try { localStorage.setItem("lunchName", name); } catch(e) {}
  msg("送出中…");
  const ref = db.doc("sessions/" + sess.id);
  try {
    const lease = await ref.acquire({ holder: uid + ":" + Date.now(), ttlMs: 5000 });
    if (!lease.acquired) { msg("有人正在選擇，請稍候再看一次"); return; }
    const snap = await ref.get();
    if (snap.exists && snap.data() && snap.data().route) return;
    await ref.set({ createdAt: sess.createdAt, route: r, byName: name, at: Date.now() });
  } catch(e) { msg("送出失敗，請重試"); }
}

/* ---------- 點餐 ---------- */
function orderTotal(items){ return items.reduce((s, i) => s + num(i.p) * (i.q || 0), 0); }
function renderOrder(){
  const c = $("orderCard"), list = storesOf(routeIdx(sess.route));
  if (list.length && !pickedStore) { c.hidden = true; return; }
  c.hidden = false;
  const st = list.find(s => s.name === pickedStore), items = st ? st.items : [];
  const k2 = sess.id + "|" + (pickedStore || "");
  if (qtyKey !== k2) { qtyKey = k2; qty = {}; touched = false; }
  const mine = myOrder && (myOrder.store || "") === (pickedStore || "") ? myOrder : null;
  if (!touched && mine) { qty = {}; (mine.items || []).forEach(i => { qty[i.n] = i.q; }); }
  const key = k2;
  if (builtKey !== key) {
    builtKey = key;
    c.innerHTML = '<h2 id="ohead"></h2><input id="oname" placeholder="你的名字" maxlength="20"><h3 id="mh">菜單</h3><div id="mimg"></div><ul id="menu"></ul><h3>你想吃什麼</h3><input id="meal" placeholder="自行輸入想吃的餐點，例如：雞腿飯" maxlength="80"><input id="note" placeholder="備註（少冰、不加蔥…）" maxlength="60"><button class="pri" id="save">送出餐點</button><div id="omsg" class="mu"></div>';
    try { $("oname").value = localStorage.getItem("lunchName") || ""; } catch(e) {}
    $("oname").oninput = $("note").oninput = $("meal").oninput = () => { touched = true; };
    $("save").onclick = saveOrder;
  }
  $("ohead").textContent = pickedStore ? "點餐：" + pickedStore : "點餐";
  if (!touched && mine) { $("oname").value = mine.name || ""; $("note").value = mine.note || ""; $("meal").value = (mine.items || []).map(i => i.n).join("、") || mine.meal || ""; $("save").textContent = "更新我的餐點"; }
  showMenu(items, st);
}
function showMenu(items, st){
  const ul = $("menu"), m = $("mimg"), src = st && st.img ? "/_blob/" + st.img : ""; ul.textContent = ""; $("mh").hidden = !items.length && !src;
  if (!src) m.textContent = ""; else if (!m.firstChild || m.firstChild.getAttribute("src") !== src) { m.textContent = ""; const g = document.createElement("img"); g.src = src; g.className = "mimg"; m.appendChild(g); }
  items.forEach(it => { const li = mk("li"); li.append(mk("span", it.n), mk("span", num(it.p) ? "$" + num(it.p) : "", "mu")); ul.appendChild(li); });
}
function drawMenu(items, mine){
  const ul = $("menu"); ul.textContent = "";
  if (!items.length) {
    const li = mk("li"), inp = document.createElement("input");
    inp.id = "meal"; inp.placeholder = "想吃什麼（這家店還沒有設定菜單）"; inp.maxLength = 60; inp.style.margin = "0";
    if (mine && mine.items && mine.items[0]) inp.value = mine.items[0].n; else if (mine && mine.meal) inp.value = mine.meal;
    inp.oninput = () => { touched = true; };
    li.appendChild(inp); ul.appendChild(li); $("tot").textContent = ""; return;
  }
  items.forEach(it => {
    const li = mk("li"), left = mk("span", it.n + (num(it.p) ? "　$" + num(it.p) : "")), step = mk("span", null, "step");
    const minus = mk("button", "−"), q = mk("b", String(qty[it.n] || 0)), plus = mk("button", "+");
    const chg = d => { qty[it.n] = Math.max(0, (qty[it.n] || 0) + d); touched = true; drawMenu(items, mine); };
    minus.onclick = () => chg(-1); plus.onclick = () => chg(1);
    step.append(minus, q, plus); li.append(left, step); ul.appendChild(li);
  });
  const sum = items.reduce((s, i) => s + num(i.p) * (qty[i.n] || 0), 0);
  $("tot").textContent = sum ? "合計 $" + sum : "";
}
async function saveOrder(){
  const name = $("oname").value.trim(), st = storesOf(routeIdx(sess.route)).find(s => s.name === pickedStore), menu = st ? st.items : [];
  const m = $("meal").value.trim(), items = m ? [{ n: m, p: 0, q: 1 }] : [];
  if (!name || !items.length) { $("omsg").textContent = "請填名字和想吃的餐點"; return; }
  try { localStorage.setItem("lunchName", name); } catch(e) {}
  try { await db.collection("sessions/" + sess.id + "/orders").doc(uid).set({ name, store: pickedStore || "", items, note: $("note").value.trim(), total: orderTotal(items), at: Date.now() }); $("omsg").textContent = "已送出"; }
  catch(e) { $("omsg").textContent = "送出失敗，請重試"; }
}

/* ---------- 彙整 ---------- */
const normOrder = o => Array.isArray(o.items) ? o : Object.assign({}, o, { items: [{ n: o.meal || "", p: 0, q: 1 }] });
function renderList(){
  $("listCard").hidden = !sess;
  $("cnt").textContent = orderCache.length;
  const by = {}, lines = [];
  orderCache.forEach(o0 => { const o = normOrder(o0), s = o.store || "（未指定店家）"; (by[s] = by[s] || []).push(o); });
  const txt = o => o.items.map(i => i.n).join("、") + (o.note ? "（" + o.note + "）" : "");
  const box = $("sumStores"); box.textContent = "";
  Object.keys(by).forEach(s => {
    box.appendChild(mk("h3", s + "（" + by[s].length + " 人）")); lines.push("【" + s + "】");
    const ul = mk("ul");
    by[s].forEach(o => { const li = mk("li"); li.append(mk("span", o.name), mk("span", txt(o), "mu")); ul.appendChild(li); lines.push(o.name + "：" + txt(o)); });
    box.appendChild(ul); lines.push("");
  });
  $("copyBox").dataset.text = lines.join("\n").trim();
}

function watchOrders(){
  if (unOrders) { unOrders(); unOrders = null; }
  orderCache = []; myOrder = null; renderList();
  if (!sess) return;
  unOrders = db.collection("sessions/" + sess.id + "/orders").onSnapshot(q => {
    orderCache = []; myOrder = null;
    q.docs.forEach(x => { const v = x.data(); if (!v) return; orderCache.push(v); if (x.id === uid) myOrder = v; });
    orderCache.sort((a, b) => (a.at || 0) - (b.at || 0)); if (sess && sess.route) renderRoute(); else renderList();
  }, () => {});
}

(async function init(){
  const timer = setTimeout(() => { $("app").textContent = "連線較慢，請稍候或重新整理頁面。"; }, 10000);
  try {
    const user = await claude.use("user");
    db = await claude.use("db");
    if (!db || !user) { clearTimeout(timer); $("app").textContent = "請先登入後再開啟此頁面。"; return; }
    uid = await user.id(); isOwner = user.isOwner();
    $("copy").onclick = async () => {
      const t = $("copyBox").dataset.text || "", b = $("copyBox");
      try { await navigator.clipboard.writeText(t); $("copy").textContent = "已複製"; setTimeout(() => { $("copy").textContent = "複製彙整文字"; }, 1500); }
      catch(e) { b.hidden = false; b.value = t; b.select(); }
    };
    db.doc("config/routes").onSnapshot(s => { cfg = s.exists ? (s.data() || {}) : {}; renderAdmin(); if (sess) renderRoute(); }, () => {});
    db.collection("sessions").orderBy("createdAt", "desc").limit(1).onSnapshot(q => {
      clearTimeout(timer);
      const prev = sess && sess.id, d = q.docs[0];
      sess = d && d.exists ? Object.assign({ id: d.id }, d.data()) : null;
      if ((sess && sess.id) !== prev) { builtKey = null; qtyKey = null; pickedStore = null; watchOrders(); }
      renderAdmin(); renderRoute();
    }, () => { $("app").textContent = "讀取失敗，請重新整理。"; });
    $("reset").onclick = async () => { if (sess && confirm("確定要重設這場的路線嗎？")) { try { await db.doc("sessions/" + sess.id).update({ route: null, byName: "", at: 0 }); } catch(e) {} } };
  } catch(e) { $("app").textContent = "載入失敗，請重新整理。"; }
})();
</script>
</body>
</html>
